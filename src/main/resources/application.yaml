spring:
  application:
    name: Community
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never
  jwt:
    secret: ${JWT_SECRET}

server:
  forward-headers-strategy: framework

aws:
  s3:
    bucket: community-925581110470-ap-northeast-2-an
    region: ap-northeast-2
    base-url: ${AWS_S3_BASE_URL}

tokenExpire:
  refresh: 1800000
  access: 600000

popular-post:
  candidate-max-age: ${POPULAR_POST_CANDIDATE_MAX_AGE:3d}
  cache:
    enabled: ${POPULAR_POST_CACHE_ENABLED:true}
    list-ttl: ${POPULAR_POST_CACHE_LIST_TTL:15m}
    body-idle-ttl: ${POPULAR_POST_CACHE_BODY_IDLE_TTL:10m}
    body-max-ttl: ${POPULAR_POST_CACHE_BODY_MAX_TTL:30m}
    state-ttl: ${POPULAR_POST_CACHE_STATE_TTL:1m}
    comment-idle-ttl: ${POPULAR_POST_CACHE_COMMENT_IDLE_TTL:10m}
    comment-max-ttl: ${POPULAR_POST_CACHE_COMMENT_MAX_TTL:30m}
    body-max-weight-bytes: ${POPULAR_POST_CACHE_BODY_MAX_WEIGHT_BYTES:4194304}
    comment-max-weight-bytes: ${POPULAR_POST_CACHE_COMMENT_MAX_WEIGHT_BYTES:8388608}
    state-max-size: ${POPULAR_POST_CACHE_STATE_MAX_SIZE:20}
    comment-index-max-size: ${POPULAR_POST_CACHE_COMMENT_INDEX_MAX_SIZE:20}
  scheduler:
    enabled: ${POPULAR_POST_SCHEDULER_ENABLED:true}
    cron: "10 */5 * * * *"
    zone: UTC
  cleanup:
    enabled: ${POPULAR_POST_CLEANUP_ENABLED:true}
    cron: "0 0 4 * * *"
    zone: Asia/Seoul

logging:
  level:
    org.springframework.web.servlet.DispatcherServlet: TRACE
    org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping: TRACE
    org.springframework.web.method.annotation: TRACE
    org.springframework.web.servlet.mvc.method.annotation.ServletInvocableHandlerMethod: TRACE
    org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver: DEBUG
    org.springframework.web.bind: DEBUG
    org.springframework.validation: DEBUG
    org:
      springframework:
        jdbc:
          core:
            JdbcTemplate: DEBUG
            StatementCreatorUtils: TRACE
    org.hibernate:
      SQL: DEBUG
      orm.jdbc.bind: TRACE
