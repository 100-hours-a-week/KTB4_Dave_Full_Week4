name: community

services:
  nginx:
    image: nginx:1.29-alpine
    container_name: community-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy

  frontend:
    image: wns1628/community-fe:latest
    container_name: community-frontend
    restart: unless-stopped
    expose:
      - "80"

  backend:
    image: "wns1628/community-be:${BACKEND_IMAGE_TAG:?BACKEND_IMAGE_TAG is required}"
    container_name: community-backend
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      - "${BACKEND_ENV_FILE:-./backend.env}"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: >-
        -Xms64m
        -Xmx128m
        -XX:MaxMetaspaceSize=192m
        -XX:+UseSerialGC
        -XX:+ExitOnOutOfMemoryError
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://localhost:8080/actuator/health/readiness
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    stop_grace_period: 30s
    mem_limit: 256m
    memswap_limit: 512m
